<div class="flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
  <h1 class="text-2xl font-semibold m-0">Estados SUNAT</h1>
  <p-select
    [options]="estados"
    optionLabel="etiqueta"
    optionValue="valor"
    [(ngModel)]="estado"
    placeholder="Todos los estados"
    [showClear]="true"
    (ngModelChange)="filtrar()"
    styleClass="w-14rem"
  />
</div>

<p-table
  [value]="listado.filas()"
  [lazy]="true"
  (onLazyLoad)="listado.cambiarPagina($event)"
  [paginator]="true"
  [first]="listado.primero()"
  [rows]="listado.tamanio()"
  [totalRecords]="listado.total()"
  [loading]="listado.cargando()"
  dataKey="id"
>
  <ng-template #header>
    <tr>
      <th>Documento</th>
      <th>Fecha</th>
      <th>Estado</th>
      <th>Mensaje</th>
      <th class="w-6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-doc>
    <tr>
      <td class="font-medium">{{ doc.tipo }} {{ doc.serie }}-{{ doc.correlativo }}</td>
      <td>{{ doc.fechaEmision }}</td>
      <td><p-tag [value]="doc.estado" [severity]="severidad(doc.estado)" /></td>
      <td>{{ doc.mensaje }}</td>
      <td>
        @if (doc.estado === 'PENDIENTE') {
          <p-button
            label="Reenviar"
            icon="pi pi-send"
            [text]="true"
            (onClick)="reenviar(doc)"
          />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="text-center text-color-secondary">No hay documentos</td>
    </tr>
  </ng-template>
</p-table>
