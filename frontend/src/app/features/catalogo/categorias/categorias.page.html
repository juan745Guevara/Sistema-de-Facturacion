<div class="flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
  <h1 class="text-2xl font-semibold m-0">Categorías</h1>
  <div class="flex gap-2">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="search"
        placeholder="Buscar categoría"
        aria-label="Buscar categoría"
        [value]="filtro()"
        (input)="filtro.set($any($event.target).value)"
      />
    </p-iconfield>
    @if (puedeEditar) {
      <p-button label="Nueva" icon="pi pi-plus" (onClick)="nueva()" />
    }
  </div>
</div>

<p-table [value]="visibles()" [loading]="cargando()" [paginator]="visibles().length > 10" [rows]="10" dataKey="id">
  <ng-template #header>
    <tr>
      <th>Nombre</th>
      @if (puedeEditar) {
        <th class="w-8rem text-right">Acciones</th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-categoria>
    <tr>
      <td>{{ categoria.nombre }}</td>
      @if (puedeEditar) {
        <td class="text-right white-space-nowrap">
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [rounded]="true"
            ariaLabel="Renombrar {{ categoria.nombre }}"
            (onClick)="abrir(categoria)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="Eliminar {{ categoria.nombre }}"
            (onClick)="eliminar(categoria)"
          />
        </td>
      }
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="puedeEditar ? 2 : 1" class="text-center text-color-secondary">No hay categorías</td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [header]="editando() ? 'Renombrar categoría' : 'Nueva categoría'"
  [modal]="true"
  [visible]="dialogoAbierto()"
  (visibleChange)="dialogoAbierto.set($event)"
  [style]="{ width: '26rem' }"
>
  <form [formGroup]="formulario" (ngSubmit)="guardar()" novalidate class="p-fluid">
    <div class="field">
      <label for="nombreCategoria">Nombre</label>
      <input pInputText id="nombreCategoria" formControlName="nombre" maxlength="100" autofocus />
      @if (nombre.invalid && nombre.touched) {
        <small class="p-error">Ingresa un nombre de hasta 100 caracteres</small>
      }
      <small class="block text-color-secondary mt-1">Se guarda en mayúsculas.</small>
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="dialogoAbierto.set(false)" />
      <p-button type="submit" label="Guardar" icon="pi pi-save" [loading]="guardando()" />
    </div>
  </form>
</p-dialog>
