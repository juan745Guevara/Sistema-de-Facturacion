spring:
  application:
    name: facturacion
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

facturacion:
  seguridad:
    jwt:
      secreto: ${JWT_SECRET}
      expiracion: ${JWT_EXPIRACION:8h}
      emisor: facturacion
    cors:
      origenes-permitidos: ${CORS_ALLOWED_ORIGINS:}
    admin-inicial:
      nombre: ${ADMIN_NOMBRE:Administrador}
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
  sunat:
    modo: ${SUNAT_MODO:BETA}
    url-facturacion: ${SUNAT_URL_FACTURACION:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
    usuario-sol: ${SUNAT_USUARIO_SOL:}
    clave-sol: ${SUNAT_CLAVE_SOL:}
    certificado:
      ruta: ${CERT_PATH:}
      clave: ${CERT_PASSWORD:}
